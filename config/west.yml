manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: ebed
      url-base: https://github.com/ebed
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # nice!epaper (zmk-nice-oled) — FORK propio sobre upstream 46f824a (testeado
    # con ZMK v0.3.0). Rama custom-epaper-layout: modifiers en orden home-row,
    # perfil BT "P<n>" junto a la batería (central) y sin tira de perfiles abajo.
    # Upstream: mctechnology17/zmk-nice-oled.
    - name: zmk-nice-oled
      remote: ebed
      revision: cf17fa2cca24e9841d782f1b8a0f8b5000c4d21f
  self:
    path: config
