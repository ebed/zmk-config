manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: ebed
      url-base: https://github.com/ebed
    - name: petejohanson
      url-base: https://github.com/petejohanson
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # nice!epaper (zmk-nice-oled) — FORK propio sobre upstream 46f824a (testeado
    # con ZMK v0.3.0). Rama custom-epaper-layout: modifiers en orden home-row,
    # perfil BT "P<n>" junto a la batería (central) y sin tira de perfiles abajo.
    # Upstream: mctechnology17/zmk-nice-oled.
    - name: zmk-nice-oled
      remote: ebed
      revision: 89b359319af78e3333aad7c2cb735b05e5977833
    # Driver cirque,pinnacle (trackpad Cirque GlidePoint SPI) — módulo oficial
    # de Pete Johanson; sin tags: pineado a commit de main (2025-02-18).
    - name: cirque-input-module
      remote: petejohanson
      revision: 0de55f36bc720b5be3d8880dc856d4d78baf5214
  self:
    path: config
