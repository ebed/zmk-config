# Duerme el Pinnacle cuando ZMK pasa a idle (CONFIG_ZMK_IDLE_TIMEOUT, 15 min)
# y lo despierta al volver a activo. Sin esto el pad nunca duerme (quitamos
# `sleep;` porque el auto-sleep por toque agregaba ~300ms de wake en cada
# pausa); con el sleeper esa latencia se paga solo en el primer toque tras
# un idle real. ZMK_MOUSE está deprecated en ZMK v0.3 pero el Kconfig del
# módulo cirque-input-module gatea el sleeper con `if ZMK_MOUSE`.
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y
