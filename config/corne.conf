# RGB Underglow (LEDs bajo el PCB) — apagado por default, toggle en Layer 3 (RGB-T)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

CONFIG_WS2812_STRIP=y

# Mouse / Pointing
CONFIG_ZMK_POINTING=y

# BLE
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Power management — display off after 10 min, deep sleep desactivado
# Deep sleep requiere reset físico (doble-tap) para despertar — OLED no vuelve solo
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=y

# Display / OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
# Brillo OLED — rango 0-255, default 128; bajar si lastima la vista
CONFIG_SSD1306_DEFAULT_CONTRAST=32

CONFIG_ZMK_KEYBOARD_NAME="MyKBD"

# Debounce — chatter detectado en ~8ms en press; release suele chatear más
# Release más alto previene que el chatter al soltar cancele el key_up event
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
