# RGB Underglow — DESHABILITADO por falla de hardware en cableado DIN
# Para re-habilitar: cambiar a CONFIG_ZMK_RGB_UNDERGLOW=y y descomentar las líneas siguientes
CONFIG_ZMK_RGB_UNDERGLOW=n
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# CONFIG_WS2812_STRIP=y

# Mouse / Pointing
CONFIG_ZMK_POINTING=y

# BLE
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Power management
# 30s idle → estado idle (nice!view NO se apaga: el shield fija BLANK_ON_IDLE=n,
#   la memory LCD consume ~nada encendida)
# 5min idle → deep sleep (wakeup: SOLO doble-tap reset físico)
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_PM_SOFT_OFF=y

# Display / nice!view (SPI via shield nice_view_adapter + nice_epaper;
# CS en P0.10 — override de cs-gpios y pines NFC en corne.keymap)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# WPM como gráfico (el default del módulo es bongo cat)
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
# Modifiers en pila vertical pegada al borde derecho: el layout BOX default
# queda fuera de pantalla en epaper (CUSTOM_X=62 + grilla de 30px en canvas de
# 68px); el modo VER+RIGHT trae coordenadas hardcodeadas para epaper en el código.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_VER=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_VER_ALIGN_RIGHT=y
# Defaults del módulo que quedan activos: modifiers ⌘⌥⇧⌃ (pila vertical derecha),
# indicador CapsLock, widget de capa, batería; Raw HID apagado (requiere
# app companion en el host).
# Idle: en vez de apagar la pantalla a los 30s, mostrar la escena "durmiendo"
# (sleep art) hasta el deep sleep (5 min), donde se corta la energía del display.
# La memory LCD consume ~nada mostrando imagen estática.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
# Periférico "smart battery": cristal (nítido en memory LCD, 16 frames) quieto
# en descarga y animando SOLO mientras carga — indicador de carga de un vistazo.
# Reemplaza la animación cat default (dithered, se veía sucia).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y

CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Debounce — chatter detectado en ~8ms en press; release suele chatear más
# Release más alto previene que el chatter al soltar cancele el key_up event
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
