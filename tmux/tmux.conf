# tmux.conf — versionado en zmk-config/tmux/. Se instala como ~/.tmux.conf (symlink) con scripts/setup-tmux.sh
# El layer 9 (Tmux) del teclado asume este prefix (Ctrl+A) y estos binds: ver LAYOUTS.md.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1            # Windows desde 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color (neovim lo necesita)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Splits intuitivos (misma dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegación vim-style entre panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize con mayúsculas
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Sesiones: cambiar rápido
bind s choose-tree -sZ        # Árbol de sesiones/windows
bind C-l switch-client -l     # Última sesión

# Status bar limpio
set -g status-position top
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa bold] #S '
set -g status-right '#[fg=#a6e3a1] %H:%M #[fg=#89dceb] %d/%m'
set -g status-left-length 20

# Vim mode en copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Sin delay en ESC (neovim)
set -sg escape-time 0
set -g focus-events on
