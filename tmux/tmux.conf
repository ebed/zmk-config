# tmux.conf — versionado en zmk-config/tmux/. Se instala como ~/.tmux.conf (symlink) con scripts/setup-tmux.sh
# Rol: motor de sesiones en máquinas REMOTAS (SSH). Local: WezTerm nativo.
# El layer 9 del teclado asume este prefix (Ctrl+A) y estos binds: ver LAYOUTS.md.

# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Base ──────────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0          # sin delay en ESC (neovim)
set -g focus-events on

# ── True color + WezTerm passthrough ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"          # true color para cualquier terminal
set -g allow-passthrough on                 # WezTerm: imágenes / gráficos inline

# ── Clipboard: copia remota → portapapeles local via OSC 52 ──────────────────
# WezTerm soporta OSC 52: al copiar en tmux en SSH, el texto llega al Mac.
set -g set-clipboard on

# ── SSH agent forwarding (el socket expira sin esto) ─────────────────────────
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# ── Splits (misma dir que pane actual) ───────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navegación vim-style entre panes ─────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize con mayúsculas ─────────────────────────────────────────────────────
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ── Sesiones ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind s choose-tree -sZ         # árbol de sesiones/windows
bind C-l switch-client -l      # última sesión

# ── Vim mode en copy ──────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar — muestra sesión + hostname (crítico en SSH) ──────────────────
set -g status-position top
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa bold] #S #[fg=#585b70]@#[fg=#a6e3a1]#(hostname -s) '
set -g status-right '#[fg=#a6e3a1] %H:%M #[fg=#89dceb] %d/%m'
set -g status-left-length 32

# ── Pane borders — muestra el comando activo por pane ────────────────────────
set -g pane-border-status top
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-format ' #[fg=#cdd6f4]#{pane_current_command} '

# ── Actividad en ventanas en segundo plano ────────────────────────────────────
set -g monitor-activity on
set -g visual-activity off     # sin campana, solo resalta la ventana
