# tmux.conf — versionado en zmk-config/tmux/. Instalar: scripts/setup-tmux.sh
# Rol: motor de sesiones en máquinas REMOTAS (SSH). Local: WezTerm nativo.
# El layer 9 del teclado asume este prefix (Ctrl+A) y estos binds: ver LAYOUTS.md.

# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Tmux anidado: F12 alterna passthrough (tecla NEST del Layer 9) ────────────
# Con tmux local + tmux remoto (SSH/mosh) ambos usan C-a: el local captura el
# prefix y el Layer 9 opera sobre el tmux equivocado. F12 apaga prefix y binds
# del tmux EXTERNO (key-table off, barra gris con "OFF") para que todo pase al
# anidado; F12 de nuevo restaura. Alternativa puntual sin toggle: C-a C-a <key>
# (send-prefix). Ojo: en una sesión sin anidar, F12 también la pone en off —
# la barra gris lo delata; otro F12 la revive.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-left "#[bg=#585b70,fg=#1e1e2e,bold] ⏸ OFF #{session_name} #[bg=#313244,fg=#585b70,nobold] #(hostname -s) #[bg=#181825,fg=#313244] " \;\
  set status-style "bg=#181825" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-left \;\
  set -u status-style \;\
  refresh-client -S

# ── Base ──────────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# ── True color + WezTerm passthrough ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"
set -g allow-passthrough on

# ── Clipboard: copia remota → Mac via OSC 52 (WezTerm lo soporta) ────────────
set -g set-clipboard on

# ── SSH agent forwarding (socket se renueva en reconexión) ───────────────────
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# ── Splits (misma dir que pane actual) ───────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navegación vim-style entre panes ─────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize (repetible con -r) ─────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Sesiones ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  Config reloaded"
bind s choose-tree -sZ
bind C-l switch-client -l

# ── Nombres de ventana: directorio actual (se actualiza al navegar) ───────────
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ── Copy mode vi ──────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/tmux-yank 2>/dev/null; true"

# ── Catppuccin Mocha ──────────────────────────────────────────────────────────
# Paleta: bg=#1e1e2e  surface=#313244  overlay=#585b70
#         mauve=#cba6f7  blue=#89b4fa  green=#a6e3a1  teal=#94e2d5  yellow=#f9e2af

set -g status-position top
set -g status-style        "bg=#1e1e2e"
set -g status-left-length  48
set -g status-right-length 32

# Left: [ session ] @ [ hostname ] — crítico para identificar máquina en SSH
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #{session_name} #[bg=#89b4fa,fg=#1e1e2e,nobold] #(hostname -s) #[bg=#1e1e2e,fg=#89b4fa] "

# Windows center
set -g window-status-format         "#[fg=#585b70] #{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] ●#{window_index}:#{window_name} #[bg=#1e1e2e,fg=#313244] "
set -g window-status-separator      ""
set -g window-status-activity-style "fg=#f9e2af"

# Right: time | date
set -g status-right "#[fg=#585b70] │ #[fg=#a6e3a1]%H:%M #[fg=#585b70]│ #[fg=#94e2d5]%d/%m "

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status       top
set -g pane-border-format       "#[fg=#585b70] #{pane_current_command} "

# Message / copy-mode styles
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style    "bg=#45475a,fg=#cdd6f4"

# ── Actividad en ventanas en segundo plano ────────────────────────────────────
set -g monitor-activity on
set -g visual-activity  off
